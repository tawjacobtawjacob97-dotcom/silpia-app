name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Force Default Python to 3.10
        run: |
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 100
          sudo ln -sf /usr/bin/python3.10 /usr/local/bin/python

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git ffmpeg libsdl2-dev libssl-dev libffi-dev python3-dev autoconf automake libtool

      - name: Install Pip Dependencies
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
