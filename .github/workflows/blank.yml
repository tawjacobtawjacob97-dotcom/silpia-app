
name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:deadsnakes/ppa
        sudo apt-get update
        sudo apt-get install -y python3.10 python3.10-dev python3.10-venv python3-pip build-essential git ffmpeg libltdl-dev libzip-dev zlib1g-dev

    - name: Force Default Python to 3.10
      run: |
        sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
        python3 --version

    - name: Install Buildozer and Cython
      run: |
        python3 -m pip install --upgrade pip
        pip install --upgrade "cython<3.0"
        pip install --upgrade buildozer
        pip install --upgrade git+https://github.com/kivy/python-for-android.git

    - name: Setup Swap Space
      run: 
        sudo swapoff /swapfile || true
        sudo rm -f /swafile
        sudo fallocate -l 4G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: Build APK with Buildozer
      run: |
        buildozer --clean -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: silpia-apk
        path: bin/*.apk
