name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:deadsnakes/ppa
        sudo apt-get update
        sudo apt-get install -y python3.10 python3.10-dev python3.10-venv python3-pip build-essential git ffmpeg libltdl-dev zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev curl

    - name: Force Default Python to 3.10
      run: |
        sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
        python3 --version

    - name: Install Buildozer and Cython
      run: |
        python3 -m pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.36

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: silpia-apk
        path: bin/*.apk
